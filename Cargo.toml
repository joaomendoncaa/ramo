[package]
name = "ramo"
version = "0.1.1"
edition = "2024"
description = "Terminal multiplexer session picker, worktrees and agents aware."
license = "MIT"
repository = "https://github.com/joaomendoncaa/ramo"
readme = false

[[bin]]
name = "ramo"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"

[profile.release]
opt-level = 2
